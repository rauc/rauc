name: sanitizers

on: [push, pull_request]

permissions:
  contents: read

jobs:
  address:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rauc/rauc/rauc-ci:trixie
      # allow mounting and devtmpfs in the container
      options: --user=root --privileged -v /dev:/dev
    steps:
    - name: Inspect environment
      run: |
        whoami
        gcc --version
        ls -l /dev/kvm || true

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install polkit dependencies
      # until the CI image built from test/Dockerfile carries them
      run: |
        apt-get update
        DEBIAN_FRONTEND='noninteractive' apt-get install -qy libpolkit-gobject-1-dev python3-dbusmock

    - name: Run meson
      run: |
        meson setup build -Db_sanitize=address,undefined -Dpolkit=enabled
        meson configure build
        meson compile -C build

    - name: Run tests
      run: |
        ./qemu-test asan

    - name: Show logs
      if: ${{ failure() }}
      run: |
        cat build/meson-logs/testlog.txt || true
