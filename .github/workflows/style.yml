name: style check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install codespell
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND='noninteractive' apt-get install -qy codespell

    - name: Run uncrustify check
      run: |
        ./uncrustify.sh
        git diff --exit-code

    - name: Run codespell check
      run: |
        codespell -L parms,cas -S 'openssl-ca,build,*.log' src include test docs

    - name: Install ruff & run checks
      run: |
        python3 -m venv venv
        . venv/bin/activate
        pip install ruff
        ruff format --check --diff test/ docs/conf.py && ruff check test/ docs/conf.py --output-format=github
