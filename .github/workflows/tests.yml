name: tests

on:
  push:
    paths-ignore:
      - 'docs/**'
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
        - service
        - noservice
        - nostreaming
        include:
        - profile: service
          meson_args: "-Dservice=true -Dgpt=enabled -Dcomposefs=enabled"
          codecov_flags: "service=true streaming=true"
        - profile: noservice
          meson_args: "-Dservice=false -Dgpt=disabled -Dcomposefs=disabled"
          codecov_flags: "service=false streaming=true"
          extra: true
        - profile: nostreaming
          meson_args: "-Dservice=true -Dgpt=disabled -Dcomposefs=disabled -Dstreaming=false"
          codecov_flags: "service=true streaming=false"
    container:
      image: ghcr.io/rauc/rauc/rauc-ci:trixie
      # allow mounting and devtmpfs in the container
      options: --user=root --privileged -v /dev:/dev
    steps:
    - name: Inspect environment
      run: |
        whoami
        gcc --version
        ls -l /dev/kvm || true

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build
      run: |
        rm -rf build/
        meson setup ${{ matrix.meson_args }} -Db_coverage=true -Dwerror=true build
        meson configure build
        meson compile -C build

    - name: Test
      run: |
        ./qemu-test
        lcov --directory . --capture --output-file "${{ matrix.profile }}.info"
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: "${{ matrix.profile }}.info"
        flags: "${{ matrix.codecov_flags }}"
        token: "${{ secrets.CODECOV_TOKEN }}"
        verbose: true

    - name: Test fuzzers
      if: ${{ matrix.extra }}
      run: |
        rm -rf build/
        meson setup -Dservice=false -Dwerror=true -Dfuzzing=true -Db_lundef=false -Db_sanitize=address build
        meson configure build
        meson compile -C build
        meson test -C build --suite rauc:fuzzing

    - name: Build CGI example
      if: ${{ matrix.extra }}
      run: |
        cd contrib/cgi
        ./autogen.sh
        ./configure CFLAGS=-Werror
        make clean
        make -j4
        make -j4 distcheck

    - name: Show logs
      if: ${{ failure() }}
      run: |
        cat build/meson-logs/testlog.txt || true
        dmesg | tail -n 100

  cross:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        architecture:
        - "arm/v5"
        - "arm/v7"
        - "arm64/v8"
        - "386"
        include:
          # disable pointer auth to avoid the performance overhead
          # https://forum.armbian.com/topic/57887-arm64-performance-regression-in-qemu/
          - architecture: "arm64/v8"
            qemu_cpu: "max,pauth=off"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install QEMU
      run: |
        sudo apt-get update
        DEBIAN_FRONTEND='noninteractive' sudo apt-get install -qy qemu-user-static

    - name: Prepare ${{ matrix.architecture }} container
      run: |
        podman run --name cross -di \
          --platform linux/${{ matrix.architecture }} \
          ${{ matrix.qemu_cpu && format('-e QEMU_CPU={0}', matrix.qemu_cpu) || '' }} \
          --userns=keep-id:uid=1000,gid=1000 -v "$PWD":/home -w /home ghcr.io/rauc/rauc/rauc-ci:trixie bash
        podman logs cross
        podman exec -i cross uname -a
        podman exec -i cross id

    - name: Build
      run: |
        podman exec -i cross meson setup -Dgpt=enabled -Dwerror=true build
        podman exec -i cross meson compile -C build

    - name: Test
      run: |
        podman exec -i cross meson test -C build --suite rauc --timeout-multiplier 3

    - name: Show logs
      if: ${{ failure() }}
      run: |
        cat build/meson-logs/testlog.txt || true

  stable:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release:
        - "ubuntu:22.04"
        - "ubuntu:24.04"
        - "ubuntu:26.04"
        - "debian:bookworm"
        - "debian:trixie"
        - "debian:testing"
        include:
        - release: "ubuntu:24.04"
          test: true
        - release: "ubuntu:26.04"
          test: true
        - release: "debian:bookworm"
          test: true
        - release: "debian:trixie"
          test: true
        - release: "debian:testing"
          test: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Prepare ${{ matrix.release }} container for meson build
      run: |
        podman version
        podman run --name stable -di --userns=keep-id:uid=1000,gid=1000 -v "$PWD":/home -w /home ${{ matrix.release }} bash
        podman exec -i stable uname -a
        podman exec -i stable id
        podman exec -i -u root stable apt-get update
        podman exec -e DEBIAN_FRONTEND='noninteractive' -i -u root stable apt-get install -qy build-essential meson libtool libglib2.0-dev libcurl3-dev libssl-dev libjson-glib-dev libdbus-1-dev libfdisk-dev libnl-genl-3-dev squashfs-tools

    - name: Patch & prepare
      run: |
        podman exec -i stable find .github/workflows/patches/${{ matrix.release }}/ -type f -name "*.patch" -print0 | sort -z | xargs -t -n 1 -r -0 patch -p1 -f -i

    - name: Install test dependencies
      if: ${{ matrix.test }}
      run: |
        podman exec -e DEBIAN_FRONTEND='noninteractive' -i -u root stable apt-get install -qy python3-pytest python3-dasbus python3-aiohttp python3-requests python3-pyasn1 python3-pyasn1-modules openssl e2fsprogs grub-common faketime dbus-daemon

    - name: Configure
      run: |
        podman exec -i stable meson setup -Dgpt=disabled -Dwerror=true build

    - name: Build
      run: |
        podman exec -i stable ninja -C build

    - name: Test
      if: ${{ matrix.test }}
      run: |
        podman exec -i stable meson test -C build --suite rauc --timeout-multiplier 3

    - name: Show logs
      if: ${{ failure() }}
      run: |
        cat build/meson-logs/testlog.txt || true
